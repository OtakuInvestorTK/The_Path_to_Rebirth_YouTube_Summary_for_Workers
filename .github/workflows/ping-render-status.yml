name: Ping Render Status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      RENDER_STATUS_ENDPOINT: ${{ secrets.RENDER_STATUS_ENDPOINT }}
    steps:
      - name: Verify endpoint is configured
        run: |
          if [ -z "${RENDER_STATUS_ENDPOINT}" ]; then
            echo "RENDER_STATUS_ENDPOINT secret is not configured."
            exit 1
          fi
      - name: Ping Render status endpoint
        run: |
          set -euo pipefail
          echo "Requesting ${RENDER_STATUS_ENDPOINT}"
          HTTP_STATUS=$(curl --silent --show-error --output /tmp/response.txt -w "%{http_code}" "${RENDER_STATUS_ENDPOINT}")
          echo "HTTP status: ${HTTP_STATUS}"
          echo "Response body:"
          cat /tmp/response.txt
          if [ "${HTTP_STATUS}" -ge 400 ]; then
            exit 1
          fi
