name: Generate Channels JSON

on:
  schedule:
    - cron: "0 8 * * *"   # 17:00 JST
  workflow_dispatch:

env:
  WORKER_ENDPOINT: ${{ secrets.WORKER_ENDPOINT }}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ENV
        run: |
          if [ -z "$WORKER_ENDPOINT" ]; then
            echo "WORKER_ENDPOINT secret is not configured"
            exit 1
          fi

      - name: Make Dir docs
        run: |
          mkdir -p docs

      - name: Fetch channels snapshot from Worker group 1
        run: |
          set -euo pipefail
          curl -fsSL "$WORKER_ENDPOINT?group=1" > docs/channels1.json
          sleep 5

      - name: Fetch channels snapshot from Worker group 1
        run: |
          set -euo pipefail
          curl -fsSL "$WORKER_ENDPOINT?group=2" > docs/channels2.json
          sleep 5

      - name: Fetch channels snapshot from Worker group 3
        run: |
          set -euo pipefail
          curl -fsSL "$WORKER_ENDPOINT?group=3" > docs/channels3.json
          sleep 5

      - name: Fetch channels snapshot from Worker group 4
        run: |
          set -euo pipefail
          curl -fsSL "$WORKER_ENDPOINT?group=4" > docs/channels4.json
          sleep 5

      - name: Fetch channels snapshot from Worker group 5
        run: |
          set -euo pipefail
          curl -fsSL "$WORKER_ENDPOINT?group=5" > docs/channels5.json
          sleep 5

      - name: Fetch channels snapshot from Worker group 6
        run: |
          set -euo pipefail
          curl -fsSL "$WORKER_ENDPOINT?group=6" > docs/channels6.json
          sleep 5

      - name: Fetch channels snapshot from Worker group 7
        run: |
          set -euo pipefail
          curl -fsSL "$WORKER_ENDPOINT?group=7" > docs/channels7.json
          sleep 5

      - name: Fetch channels snapshot from Worker group 8
        run: |
          set -euo pipefail
          curl -fsSL "$WORKER_ENDPOINT?group=8" > docs/channels8.json

      - name: Merge JSON files
        run: |
          jq -s '
            {
              requestedAt: (first(.[] | .requestedAt) // (now | strftime("%Y-%m-%dT%H:%M:%SZ"))),
              channels: ([ .[].channels[] ])
            }
          ' docs/channels1.json docs/channels2.json docs/channels3.json docs/channels4.json docs/channels5.json docs/channels6.json docs/channels7.json docs/channels8.json > docs/channels.json

      - name: Commit and push if changed
        run: |
          if git diff --quiet docs/channels.json docs/channels1.json docs/channels2.json docs/channels3.json docs/channels4.json docs/channels5.json docs/channels6.json docs/channels7.json docs/channels8.json; then
            echo "No changes detected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/channels.json docs/channels1.json docs/channels2.json docs/channels3.json docs/channels4.json docs/channels5.json docs/channels6.json docs/channels7.json docs/channels8.json
          git commit -m "chore: update channels snapshots"
          git push
      
