name: Generate Channels JSON

on:
  schedule:
    - cron: "0 8 * * *"   # 17:00 JST
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch channels snapshot from Worker
        env:
          WORKER_ENDPOINT: ${{ secrets.WORKER_ENDPOINT }}
        run: |
          if [ -z "$WORKER_ENDPOINT" ]; then
            echo "WORKER_ENDPOINT secret is not configured"
            exit 1
          fi
          mkdir -p docs
          set -euo pipefail
          curl -fsSL "$WORKER_ENDPOINT?group=1" > docs/channels1.json
          curl -fsSL "$WORKER_ENDPOINT?group=2" > docs/channels2.json
          curl -fsSL "$WORKER_ENDPOINT?group=3" > docs/channels3.json
          curl -fsSL "$WORKER_ENDPOINT?group=4" > docs/channels4.json

      - name: Merge JSON files
        run: |
          jq -s '
            {
              requestedAt: (first(.[] | .requestedAt) // (now | strftime("%Y-%m-%dT%H:%M:%SZ"))),
              channels: ([ .[].channels[] ])
            }
          ' docs/channels1.json docs/channels2.json docs/channels3.json docs/channels4.json > docs/channels.json

      - name: Commit and push if changed
        run: |
          if git diff --quiet docs/channels.json docs/channels1.json docs/channels2.json docs/channels3.json docs/channels4.json; then
            echo "No changes detected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/channels.json docs/channels1.json docs/channels2.json docs/channels3.json docs/channels4.json
          git commit -m "chore: update channels snapshots"
          git push
      
      - name: If failure
        if: failure()
        run: |
          cat docs/channels1.json
          cat docs/channels2.json
          cat docs/channels3.json
          cat docs/channels4.json
