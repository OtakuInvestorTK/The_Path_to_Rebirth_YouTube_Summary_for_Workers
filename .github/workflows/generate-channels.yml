name: Generate Channels JSON

on:
  schedule:
    - cron: "0 8 * * *"   # 17:00 JST
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch channels snapshot from Worker
        env:
          WORKER_ENDPOINT: ${{ secrets.WORKER_ENDPOINT }}
        run: |
          if [ -z "$WORKER_ENDPOINT" ]; then
            echo "WORKER_ENDPOINT secret is not configured"
            exit 1
          fi
          mkdir -p docs
          curl -Lv "$WORKER_ENDPOINT" > docs/channels.json
          cat docs/channels.json

